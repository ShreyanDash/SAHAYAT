org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# ---- SAHAYAT backend configuration (non-secret) ----
# Region your Cloud Functions are deployed to.
sahayat.functionsRegion=asia-south1
# Set to true to point the app at the local Firebase Emulator Suite (debug builds only).
sahayat.useEmulator=false
# Host the emulator is reachable at from the device (10.0.2.2 = host machine from the Android emulator).
sahayat.emulatorHost=10.0.2.2
